👍 ขุมพลังเครื่องยนต์ดีเซล 1.9 Ddi Blue Power ประหยัดน้ำมัน ทนทาน อภิมหาพิมพ์นิยม:
• เครื่องยนต์ดีเซล รหัส RZ4E-TC 4 สูบแถวเรียง 16 วาล์ว DOHC ขนาด 1.9 ลิตร (1,898 ซีซี)
• ระบบอัดอากาศ VGS เทอร์โบแปรผัน และอินเตอร์คูลเลอร์ มอบพละกำลังสูงสุด 150 แรงม้า ที่ 3,600 รอบ/นาที แรงบิดสูงสุด 350 นิวตัน-เมตร ที่ 1,800 – 2,600 รอบ/นาที ตอบสนองดีเยี่ยมในรอบต่ำ ออกตัวฉับไว
• จับคู่กับเกียร์อัตโนมัติ 6 สปีด พร้อมโหมด Rev Tronic สามารถเลือกเปลี่ยนเกียร์เองได้ ขับขี่สมูท นุ่มนวล และประหยัดน้ำมันได้อย่างยอดเยี่ยม
• ขึ้นชื่อเรื่องความทนทาน ไม่จุกจิก อะไหล่หาง่าย อู่ไหนก็ซ่อมได้ ค่าบำรุงรักษาต่ำสุด ๆ ในพิกัดรถกระบะเมืองไทย

👍 ดีไซน์ภายนอกโฉบเฉี่ยว ภูมิฐาน สไตล์สปอร์ตยกสูงแบบ Hi-Lander:
• ตัวถังสีเทา (Grey) สวยหรู ร่วมสมัย ดูแลรักษาง่าย ไม่สกปรกง่าย ขับเน้นเส้นสายมิติตัวรถให้ดูพรีเมียม
• กระจังหน้าโครเมียมดีไซน์หรูหราแบบ 3 มิติ โดดเด่นเป็นเอกลักษณ์เฉพาะตัวของ Isuzu
• ไฟหน้าแบบ ISUZU Vision Bi-LED คมชัด ให้ความสว่างสูง พร้อมระบบเปิด-ปิดไฟหน้าอัตโนมัติ และระบบปรับระดับไฟหน้า สูง-ต่ำ เสริมด้วยไฟเลี้ยวและไฟ LED Daytime Running Light ในโคมเดียวกัน
• ไฟตัดหมอกคู่หน้าแบบ LED ตกแต่งด้วยกรอบสีดำสปอร์ต
• ไฟท้ายดีไซน์แบบ Dual-Sonic LED สวยงาม คมชัด ปลอดภัยทุกมุมมอง
• บันไดข้างดีไซน์สปอร์ตสีเงิน-ดำ ติดตั้งจากโรงงาน แข็งแรงทนทาน ช่วยให้ก้าวเข้า-ออกห้องโดยสารรถยกสูงได้อย่างสะดวกสบาย
• กันชนท้ายดีไซน์แบบ Integrated เชื่อมต่อเข้ากับตัวถังรถได้อย่างเรียบหรูลงตัว
• ล้ออัลลอยปัดเงาทูโทนขนาด 18 นิ้ว ลายหรูหราเต็มซุ้มล้อ ยกระดับความพรีเมียม

👍 ห้องโดยสารกว้างขวาง หรูหรา ออปชันจัดเต็มระดับเกรด Z:
• ห้องโดยสาร 4 ประตู (CAB-4) กว้างขวาง นั่งสบาย พื้นที่วางขาและพื้นที่เหนือศีรษะโปร่งโล่ง ตกแต่งหรูหราด้วยโทนสีดำสปอร์ต
• เบาะนั่งดีไซน์พรีเมียมโอบรับสรีระ หุ้มด้วยหนังสังเคราะห์เกรดพรีเมียม พร้อมเทคโนโลยี COOLMAX ช่วยลดการสะสมความร้อน นั่งสบายตลอดการเดินทาง
• พวงมาลัยมัลติฟังก์ชันหุ้มหนัง ปรับได้ 4 ทิศทาง (ขึ้น-ลง-เข้า-ออก) พร้อมปุ่มควบคุมเครื่องเสียงและ ระบบควบคุมความเร็วอัตโนมัติ (Cruise Control)
• หน้าจอแสดงข้อมูลการขับขี่ Smart MID ขนาดใหญ่หน้าจอสี TFT อ่านง่ายคมชัด แสดงผลข้อมูลตัวรถครบครัน
• หน้าจอระบบสัมผัสขนาด 7 นิ้ว Infotainment Display รองรับระบบ Apple CarPlay และ Android Auto เชื่อมต่อ Bluetooth และ USB ได้อย่างสมบูรณ์แบบ
• ระบบปรับอากาศแบบมาตรฐานใช้งานง่าย ส่งความเย็นฉ่ำรวดเร็วทันใจ พร้อมช่องแอร์สำหรับผู้โดยสารตอนหลัง
• ระบบกุญแจอัจฉริยะ Isuzu Genius Entry พร้อมปุ่มสตาร์ทเครื่องยนต์ Push Start เพิ่มความสะดวกสบายสูงสุด

👍 ระบบเทคโนโลยีความปลอดภัยมาตรฐาน มั่นใจในทุกเส้นทาง:
• โครงสร้างตัวถังนิรภัย Ultra-High Tensile แข็งแกร่ง ซับแรงกระแทกได้ดีเยี่ยม
• ถุงลมนิรภัยคู่หน้า 2 ตำแหน่ง ปกป้องคนขับและผู้โดยสารตอนหน้า
• กล้องมองภาพด้านหลังขณะถอยจอด พร้อมเส้นกะระยะเลี้ยวตามพวงมาลัย ช่วยให้ถอยจอดได้อย่างปลอดภัยและแม่นยำ
• ระบบเบรกป้องกันล้อล็อก ABS พร้อมระบบกระจายแรงเบรก EBD และระบบเสริมแรงเบรก BA
• ระบบควบคุมเสถียรภาพการทรงตัว ESC และระบบป้องกันล้อหมุนฟรี TCS
• ระบบช่วยออกตัวบนทางลาดชัน HSA (Hill Start Assist) และระบบควบคุมความเร็วขณะลงทางลาดชัน HDC (Hill Descent Control)
• สัญญาณไฟฉุกเฉินอัตโนมัติขณะเบรกกะทันหัน ESS (Emergency Stop Signal)
• จุดยึดเบาะนั่งสำหรับเด็ก ISOFIX ที่เบาะตอนหลัง
