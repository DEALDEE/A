    <!-- ปรับให้ iframe โหลดเร็วขึ้น -->
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* ปิดการเลื่อนของเบราว์เซอร์ */
        }

         iframe {
            width: 100%;
            height: 100vh;
            border: none;
            loading: lazy; /* โหลด iframe แบบ Lazy Load */
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #2d7cff;
            z-index: 999; /* ทำให้ข้อความโหลดอยู่ด้านบนสุด */
        }
        
        #myFrame {
            position: fixed; /* เปลี่ยนเป็น fixed เพื่อให้ยึดติด */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: none;
            z-index: 1000; /* ทำให้ iframe อยู่เหนือข้อความโหลด */
        }
    </style>
 
<body>
 <div id="loading">Loading platform...</div>
 <iframe id="myFrame" src=""></iframe>
 
<script>
  (function() {
    let combinedId = "";
    
    // ดึง path ทั้งหมดหลังจากโดเมน (เช่น /path/to/page?query=123)
    let fullPath = window.location.pathname + window.location.search;
    
    // ตัดเครื่องหมาย / ตัวแรกออก (ถ้ามี) เพื่อให้ได้ค่าที่ต่อกันสวยงาม
    if (fullPath.startsWith("/")) {
        fullPath = fullPath.substring(1);
    }
    
    combinedId = fullPath;

    let cacheBust = new Date().getTime();
    
    // ส่งค่ารวมไปที่ ?seree=
    let link3 = "https://script.google.com/macros/s/AKfycbybhu0pQ1H5eHhxl9yj08V0WMn4XeeAXfiMqMdIIViSMmNRmKpxZ2jA7nEhB2bLdxvT/exec?seree=" + combinedId + "&cb=" + cacheBust;

    let iframe = document.querySelector("#myFrame");
    let loadingDiv = document.querySelector("#loading");

    iframe.onload = function() {
        loadingDiv.style.display = "none";
        iframe.style.display = "block";
    };

    let link = window.location.href;
    if (!link.includes("dealdee.github.io/index.html")) {
        iframe.setAttribute("src", link3);
    }
  })();
</script>
